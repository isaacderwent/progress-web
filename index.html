<!DOCTYPE html>
<html lang="en-AU">
<head>
  <!-- Replaced by the base href given to `flutter build web`:
       tool/build_web.sh passes /progress-web/, where GitHub Pages serves
       the app. -->
  <base href="/progress-web/">

  <meta charset="UTF-8">
  <meta name="description" content="Your strength training, logged and kept on this device.">
  <meta name="theme-color" content="#000000">

  <!-- Added to a home screen, it opens full screen under its own name. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Progress">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Progress</title>
  <!-- Black while the app loads, as the dark look and the launch screen. -->
  <style>html, body { margin: 0; background: #000000; }</style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
